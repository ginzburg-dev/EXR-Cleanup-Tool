name: Release

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Publish release
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.head_repository.full_name == github.repository
            )
        runs-on: ubuntu-latest

        steps:
            -
                name: Check out repository
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0
                    ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            -
                name: Read project version
                id: version
                shell: bash
                run: |
                    version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' CMakeLists.txt)"

                    if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo "Could not read a valid project version from CMakeLists.txt" >&2
                        exit 1
                    fi

                    echo "value=$version" >> "$GITHUB_OUTPUT"

            -
                name: Create GitHub release
                env:
                    GH_TOKEN: ${{ github.token }}
                    RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
                    RELEASE_TAG: v${{ steps.version.outputs.value }}
                shell: bash
                run: |
                    if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                        echo "$RELEASE_TAG already exists"
                        exit 0
                    fi

                    gh release create "$RELEASE_TAG" \
                        --repo "$GITHUB_REPOSITORY" \
                        --target "$RELEASE_COMMIT" \
                        --title "$RELEASE_TAG" \
                        --generate-notes
